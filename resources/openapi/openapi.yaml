openapi: 3.0.3

info:
  title: API VOXO
  version: 0.1.0
  description: |
    API REST de VOXO, plateforme de support client assisté par IA.

    ## Authentification

    Jeton porteur : `Authorization: Bearer {token}`. Le jeton s'obtient à
    l'inscription, à la connexion ou à l'acceptation d'une invitation.

    ## Périmètre d'espace de travail

    Le jeton porte l'espace de travail dans lequel son titulaire agit. Les
    routes sous `/workspace` s'appliquent à cet espace : aucun identifiant
    d'espace n'est lu dans l'URL ni dans le corps. On change d'espace par
    `POST /workspaces/{workspace}/switch`.

    ## Erreurs

    Toute erreur répond `{ "message", "error_code", "context" }`. Les erreurs de
    validation (422, `validation_failed`) ajoutent `errors`, par champ. Les
    clients routent sur `error_code`, jamais sur `message`.

servers:
  - url: /api/v1

tags:
  - name: Santé
  - name: Authentification
  - name: Profil
  - name: Espaces de travail
  - name: Équipe
  - name: Invitations
  - name: Base de connaissances

paths:
  /health:
    get:
      tags: [Santé]
      summary: État du service et de sa base de données
      security: []
      responses:
        '200':
          description: Service opérationnel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Service dégradé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /auth/register:
    post:
      tags: [Authentification]
      summary: Créer un compte et son premier espace de travail
      description: L'appelant devient propriétaire de l'espace créé. Un e-mail de vérification est envoyé.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation, workspace_name]
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
                password_confirmation: { type: string, format: password }
                workspace_name: { type: string, minLength: 2, maxLength: 120 }
                locale: { $ref: '#/components/schemas/Locale' }
                device_name: { type: string, maxLength: 100 }
      responses:
        '201':
          description: Compte créé, session ouverte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedSessionEnvelope' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [Authentification]
      summary: Ouvrir une session
      description: |
        Codes d'erreur : `invalid_credentials`, `account_disabled` (403),
        `two_factor_required` (le compte exige `code`), `invalid_two_factor_code`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                code: { type: string, nullable: true, description: "Code TOTP, si la double authentification est active" }
                device_name: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Session ouverte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedSessionEnvelope' }
        '403': { $ref: '#/components/responses/DomainError' }
        '422': { $ref: '#/components/responses/DomainError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      tags: [Authentification]
      summary: Révoquer le jeton de la session en cours
      responses:
        '204': { description: Session fermée }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/me:
    get:
      tags: [Authentification]
      summary: Compte, espace de travail courant et permissions de l'appelant
      responses:
        '200':
          description: Session en cours
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/email/verify:
    post:
      tags: [Authentification]
      summary: Vérifier une adresse e-mail à partir du lien reçu
      description: Rejouer un lien déjà utilisé répond 200. Code d'erreur `invalid_verification_token`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Adresse vérifiée
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      email: { type: string, format: email }
                      email_verified: { type: boolean }
        '422': { $ref: '#/components/responses/DomainError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/email/resend:
    post:
      tags: [Authentification]
      summary: Renvoyer l'e-mail de vérification
      description: Sans effet si l'adresse est déjà vérifiée.
      responses:
        '204': { description: Demande prise en compte }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password/forgot:
    post:
      tags: [Authentification]
      summary: Demander un lien de réinitialisation du mot de passe
      description: Répond 204 que l'adresse corresponde ou non à un compte.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '204': { description: Demande prise en compte }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password/reset:
    post:
      tags: [Authentification]
      summary: Choisir un nouveau mot de passe à partir du lien reçu
      description: Ferme toutes les sessions ouvertes du compte. Code d'erreur `invalid_reset_token`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password, password_confirmation]
              properties:
                email: { type: string, format: email }
                token: { type: string }
                password: { type: string, format: password, minLength: 8 }
                password_confirmation: { type: string, format: password }
      responses:
        '204': { description: Mot de passe changé }
        '422': { $ref: '#/components/responses/DomainError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/two-factor:
    post:
      tags: [Authentification]
      summary: Démarrer l'activation de la double authentification
      description: Le secret reste sans effet tant qu'il n'est pas confirmé par un premier code.
      responses:
        '200':
          description: Secret généré
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      secret: { type: string }
                      otpauth_url: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    delete:
      tags: [Authentification]
      summary: Désactiver la double authentification
      description: Code d'erreur `invalid_password`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
      responses:
        '200':
          description: Double authentification désactivée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorStateEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/DomainError' }

  /auth/two-factor/confirm:
    post:
      tags: [Authentification]
      summary: Confirmer l'activation par un premier code
      description: Codes d'erreur `two_factor_not_started` (409), `invalid_two_factor_code`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: Double authentification active
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwoFactorStateEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/DomainError' }
        '422': { $ref: '#/components/responses/DomainError' }

  /profile:
    put:
      tags: [Profil]
      summary: Modifier son nom ou sa langue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
                locale: { $ref: '#/components/schemas/Locale' }
      responses:
        '200':
          description: Profil mis à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /profile/password:
    put:
      tags: [Profil]
      summary: Changer son mot de passe
      description: Code d'erreur `current_password_mismatch`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string, format: password }
                password: { type: string, format: password, minLength: 8 }
                password_confirmation: { type: string, format: password }
      responses:
        '204': { description: Mot de passe changé }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/DomainError' }

  /workspaces:
    get:
      tags: [Espaces de travail]
      summary: Espaces de travail de l'appelant, avec le rôle qu'il y tient
      responses:
        '200':
          description: Liste des espaces
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Membership' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Espaces de travail]
      summary: Créer un espace de travail supplémentaire
      description: L'appelant en devient propriétaire. La session reste sur l'espace courant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
      responses:
        '201':
          description: Espace créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Membership' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /workspaces/{workspace}/switch:
    post:
      tags: [Espaces de travail]
      summary: Basculer la session en cours sur un autre de ses espaces
      description: Code d'erreur `workspace_scope_violation` si l'appelant n'en est pas membre.
      parameters:
        - { name: workspace, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Session basculée
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Membership' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DomainError' }

  /workspace:
    get:
      tags: [Espaces de travail]
      summary: Espace de travail courant
      description: Permission `workspace.view`.
      responses:
        '200':
          description: Espace courant
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DomainError' }
    put:
      tags: [Espaces de travail]
      summary: Modifier les réglages de l'espace courant
      description: Permission `workspace.manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                locale: { $ref: '#/components/schemas/Locale' }
                timezone: { type: string, example: Europe/Paris }
      responses:
        '200':
          description: Espace mis à jour
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DomainError' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /workspace/members:
    get:
      tags: [Équipe]
      summary: Membres de l'espace courant
      description: Permission `members.view`.
      parameters:
        - { name: role, in: query, schema: { $ref: '#/components/schemas/WorkspaceRole' } }
        - { name: search, in: query, schema: { type: string }, description: Nom ou adresse e-mail }
        - { name: sort, in: query, schema: { type: string, enum: [role, joined_at] } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Page de membres
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
                  links: { type: object }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DomainError' }

  /workspace/members/{member}:
    parameters:
      - { name: member, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Équipe]
      summary: Changer le rôle d'un membre
      description: |
        Permission `members.manage`. Codes d'erreur : `owner_protected` (409),
        `self_membership_change` (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/AssignableWorkspaceRole' }
      responses:
        '200':
          description: Rôle modifié
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DomainError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Équipe]
      summary: Retirer un membre de l'espace
      description: Permission `members.manage`. Mêmes protections que le changement de rôle.
      responses:
        '204': { description: Membre retiré }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DomainError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /workspace/invitations:
    get:
      tags: [Invitations]
      summary: Invitations en attente de l'espace courant
      description: Permission `members.manage`.
      responses:
        '200':
          description: Invitations en attente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DomainError' }
    post:
      tags: [Invitations]
      summary: Inviter une adresse e-mail, ou renouveler son invitation
      description: Permission `members.manage`. Code d'erreur `already_member` (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { $ref: '#/components/schemas/AssignableWorkspaceRole' }
      responses:
        '201':
          description: Invitation envoyée
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DomainError' }
        '409': { $ref: '#/components/responses/DomainError' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /workspace/invitations/{invitation}:
    delete:
      tags: [Invitations]
      summary: Révoquer une invitation
      description: Permission `members.manage`.
      parameters:
        - { name: invitation, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Invitation révoquée }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DomainError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspace/knowledge/sources:
    get:
      tags: [Base de connaissances]
      summary: Sources de connaissance de l'espace courant
      description: Permission `knowledge.view`.
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/KnowledgeSourceType' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Page de sources
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/KnowledgeSource' }
                  links: { type: object }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DomainError' }

  /workspace/knowledge/sources/{source}:
    parameters:
      - { name: source, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Base de connaissances]
      summary: Supprimer une source et ses documents
      description: Permission `knowledge.manage`. Supprime aussi les fichiers importés associés.
      responses:
        '204': { description: Source supprimée }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DomainError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspace/knowledge/sources/{source}/recrawl:
    post:
      tags: [Base de connaissances]
      summary: Redéclencher l'exploration d'une source de type site web
      description: Permission `knowledge.manage`. Code d'erreur `website_source_required` (422).
      parameters:
        - { name: source, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Exploration mise en file }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DomainError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/DomainError' }

  /workspace/knowledge/uploads:
    post:
      tags: [Base de connaissances]
      summary: Importer des fichiers comme nouvelle source
      description: |
        Permission `knowledge.manage`. Un document est créé par fichier reçu,
        chacun mis en file pour extraction, découpage et embeddings.
        Formats pris en charge : PDF, DOCX, TXT, Markdown, tableurs.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, files]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '201':
          description: Source créée
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/KnowledgeSource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DomainError' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /workspace/knowledge/websites:
    post:
      tags: [Base de connaissances]
      summary: Explorer un site web comme nouvelle source
      description: |
        Permission `knowledge.manage`. Code d'erreur
        `website_source_configuration_invalid` (422). La ré-indexation
        planifiée suit `recrawl_frequency`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, recrawl_frequency]
              properties:
                name: { type: string, nullable: true, maxLength: 120 }
                url: { type: string, format: uri }
                sitemap_url: { type: string, format: uri, nullable: true }
                recrawl_frequency: { $ref: '#/components/schemas/RecrawlFrequency' }
      responses:
        '201':
          description: Source créée, exploration mise en file
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/KnowledgeSource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DomainError' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /workspace/knowledge/documents:
    get:
      tags: [Base de connaissances]
      summary: Documents de connaissance de l'espace courant
      description: Permission `knowledge.view`.
      parameters:
        - { name: source_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/KnowledgeDocumentStatus' } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/KnowledgeDocumentType' } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Page de documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/KnowledgeDocument' }
                  links: { type: object }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DomainError' }

  /workspace/knowledge/documents/{document}:
    parameters:
      - { name: document, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Base de connaissances]
      summary: Consulter un document et son statut d'indexation
      description: Permission `knowledge.view`.
      responses:
        '200':
          description: Document
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/KnowledgeDocument' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DomainError' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Base de connaissances]
      summary: Supprimer un document
      description: Permission `knowledge.manage`. Supprime aussi le fichier importé associé.
      responses:
        '204': { description: Document supprimé }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DomainError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspace/knowledge/documents/{document}/retry:
    post:
      tags: [Base de connaissances]
      summary: Redéclencher l'indexation d'un document en échec
      description: |
        Permission `knowledge.manage`. Code d'erreur `document_not_retryable`
        (409) si le document n'est pas en échec.
      parameters:
        - { name: document, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Document remis en file
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/KnowledgeDocument' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DomainError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DomainError' }

  /workspace/knowledge/qa-entries:
    get:
      tags: [Base de connaissances]
      summary: Entrées question/réponse saisies à la main
      description: Permission `knowledge.view`.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Page d'entrées
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/KnowledgeQaEntry' }
                  links: { type: object }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DomainError' }
    post:
      tags: [Base de connaissances]
      summary: Ajouter une entrée question/réponse
      description: Permission `knowledge.manage`. Code d'erreur `qa_content_required` (422).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, answer]
              properties:
                question: { type: string, minLength: 3, maxLength: 500 }
                answer: { type: string, minLength: 3, maxLength: 5000 }
      responses:
        '201':
          description: Entrée créée
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/KnowledgeQaEntry' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DomainError' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /workspace/knowledge/qa-entries/{document}:
    parameters:
      - { name: document, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Base de connaissances]
      summary: Modifier une entrée question/réponse
      description: Permission `knowledge.manage`. Ré-indexe l'entrée après modification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, answer]
              properties:
                question: { type: string, minLength: 3, maxLength: 500 }
                answer: { type: string, minLength: 3, maxLength: 5000 }
      responses:
        '200':
          description: Entrée modifiée
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/KnowledgeQaEntry' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DomainError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Base de connaissances]
      summary: Supprimer une entrée question/réponse
      description: Permission `knowledge.manage`.
      responses:
        '204': { description: Entrée supprimée }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DomainError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspace/knowledge/search:
    post:
      tags: [Base de connaissances]
      summary: Rechercher dans la base de connaissances de l'espace courant
      description: |
        Permission `knowledge.view`. Aperçu de la recherche sémantique que
        l'agent IA utilisera (lot 2) : passages les plus proches, avec score
        et citation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, minLength: 2, maxLength: 500 }
                limit: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        '200':
          description: Passages trouvés, triés par score décroissant
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/KnowledgeSearchResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/DomainError' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /invitations/{token}:
    get:
      tags: [Invitations]
      summary: Consulter une invitation à partir du jeton reçu par e-mail
      description: Codes d'erreur `invitation_invalid` (404), `invitation_expired` (410).
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Invitation utilisable
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/InvitationPreview' }
        '404': { $ref: '#/components/responses/DomainError' }
        '410': { $ref: '#/components/responses/DomainError' }

  /invitations/{token}/accept:
    post:
      tags: [Invitations]
      summary: Accepter une invitation
      description: |
        Trois cas. Connecté avec le compte invité : la session bascule sur
        l'espace rejoint, `token` vaut `null`. Sans compte : `name` et
        `password` créent le compte, une session est ouverte. Compte existant
        mais non connecté : `login_required` (409).

        Autres codes : `invitation_email_mismatch` (403),
        `account_details_required` (422), `invitation_invalid` (404),
        `invitation_expired` (410).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
                password: { type: string, format: password, minLength: 8 }
                password_confirmation: { type: string, format: password }
                device_name: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Invitation acceptée
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token: { type: string, nullable: true }
                      workspace_id: { type: string, format: uuid }
        '403': { $ref: '#/components/responses/DomainError' }
        '404': { $ref: '#/components/responses/DomainError' }
        '409': { $ref: '#/components/responses/DomainError' }
        '410': { $ref: '#/components/responses/DomainError' }
        '422': { $ref: '#/components/responses/DomainError' }

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Jeton Sanctum, porteur de l'espace de travail de la session.

  responses:
    Unauthenticated:
      description: Jeton absent, invalide ou expiré (`unauthenticated`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Ressource introuvable dans l'espace de travail courant (`not_found`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    DomainError:
      description: Erreur métier, identifiée par `error_code`
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: Données invalides (`validation_failed`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    TooManyRequests:
      description: Limite de débit atteinte (`too_many_requests`)
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    WorkspaceRole:
      type: string
      enum: [workspace_owner, workspace_admin, agent, viewer]

    AssignableWorkspaceRole:
      type: string
      description: Rôles attribuables par invitation ou changement de rôle.
      enum: [workspace_admin, agent, viewer]

    Locale:
      type: string
      enum: [fr, en]

    Error:
      type: object
      required: [message, error_code, context]
      properties:
        message: { type: string }
        error_code: { type: string }
        context: { type: object }

    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }

    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        checks:
          type: object
          properties:
            database: { type: string, enum: [ok, unreachable] }
        timestamp: { type: string, format: date-time }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        locale: { $ref: '#/components/schemas/Locale' }
        email_verified: { type: boolean }
        two_factor_enabled: { type: boolean }
        last_login_at: { type: string, format: date-time, nullable: true }

    Membership:
      type: object
      description: Un espace de travail et le rôle que l'appelant y tient.
      properties:
        id: { type: string, format: uuid, description: Identifiant de l'espace de travail }
        name: { type: string }
        slug: { type: string }
        role: { $ref: '#/components/schemas/WorkspaceRole' }

    Session:
      type: object
      properties:
        user:
          allOf:
            - $ref: '#/components/schemas/User'
            - type: object
              properties:
                is_platform_admin: { type: boolean }
        workspace:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Membership'
        permissions:
          type: array
          description: Permissions du rôle tenu dans l'espace courant.
          items: { type: string }
        workspaces:
          type: array
          items: { $ref: '#/components/schemas/Membership' }

    IssuedSessionEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            token: { type: string }
            session: { $ref: '#/components/schemas/Session' }

    TwoFactorStateEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            enabled: { type: boolean }

    Workspace:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        locale: { $ref: '#/components/schemas/Locale' }
        timezone: { type: string }
        created_at: { type: string, format: date-time }

    Member:
      type: object
      properties:
        id: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/WorkspaceRole' }
        role_label: { type: string }
        joined_at: { type: string, format: date-time }
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            email: { type: string, format: email }
            last_login_at: { type: string, format: date-time, nullable: true }

    Invitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/AssignableWorkspaceRole' }
        role_label: { type: string }
        invited_by: { type: string, nullable: true }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    InvitationPreview:
      type: object
      properties:
        email: { type: string, format: email }
        workspace_name: { type: string }
        role: { $ref: '#/components/schemas/AssignableWorkspaceRole' }
        role_label: { type: string }
        invited_by: { type: string, nullable: true }
        expires_at: { type: string, format: date-time }
        account_exists: { type: boolean }

    KnowledgeSourceType:
      type: string
      enum: [upload, website, manual]

    KnowledgeDocumentType:
      type: string
      enum: [file, website_page, qa]

    KnowledgeDocumentStatus:
      type: string
      enum: [pending, processing, indexed, failed]

    RecrawlFrequency:
      type: string
      enum: [manual, daily, weekly]

    KnowledgeSource:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/KnowledgeSourceType' }
        type_label: { type: string }
        name: { type: string }
        website_url: { type: string, nullable: true }
        website_sitemap_url: { type: string, nullable: true }
        recrawl_frequency: { $ref: '#/components/schemas/RecrawlFrequency' }
        last_crawled_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    KnowledgeDocument:
      type: object
      properties:
        id: { type: string, format: uuid }
        source_id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/KnowledgeDocumentType' }
        type_label: { type: string }
        title: { type: string }
        origin_url: { type: string, nullable: true }
        original_filename: { type: string, nullable: true }
        mime_type: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/KnowledgeDocumentStatus' }
        status_label: { type: string }
        status_message: { type: string, nullable: true }
        chunk_count: { type: integer }
        indexed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    KnowledgeQaEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        question: { type: string }
        answer: { type: string }
        status: { $ref: '#/components/schemas/KnowledgeDocumentStatus' }
        status_label: { type: string }
        chunk_count: { type: integer }
        created_at: { type: string, format: date-time }

    KnowledgeSearchResult:
      type: object
      properties:
        document_id: { type: string, format: uuid }
        document_title: { type: string }
        chunk_content: { type: string }
        score: { type: number, format: float }
        citation_url: { type: string, nullable: true }

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
